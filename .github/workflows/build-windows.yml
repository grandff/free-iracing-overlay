name: Build Windows Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer & Portable Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      # vite copies public/ into dist/, and tauri bundles dist/ into the installer.
      # A stray public/fonts/*.woff2 would publish the proprietary Formula One
      # typeface. Nothing here runs `npm run setup-fonts`, so this should never
      # trip - it exists so that adding such a step fails loudly instead of
      # silently shipping the font. See THIRD-PARTY-NOTICES.md.
      - name: Verify no proprietary fonts in build output
        shell: bash
        run: |
          if compgen -G "dist/fonts/*.woff2" > /dev/null || compgen -G "public/fonts/*.woff2" > /dev/null; then
            echo "::error::Proprietary Formula1 font files present - refusing to build a redistributable installer."
            exit 1
          fi
          echo "No proprietary fonts present; Roboto fallback will be used."

      - name: Build Tauri Windows Installer
        run: npx @tauri-apps/cli build

      - name: Upload Windows Artifacts (Installer & Binaries)
        uses: actions/upload-artifact@v4
        with:
          name: Free-iRacing-Overlay-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/*.exe
          if-no-files-found: warn

      - name: Create GitHub Release (On Tagged Release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          draft: false
          prerelease: false
          generate_release_notes: true
