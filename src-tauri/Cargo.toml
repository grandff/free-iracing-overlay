[package]
name = "free-iracing-overlay"
version = "0.1.3"
description = "Ultra-lightweight 100% free iRacing broadcast overlay"
authors = ["Kim Jeongmin"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Font install (fetch_theme_font). ureq is the blocking, tokio-free client:
# tokio was deliberately removed from this project for bundle weight.
ureq = { version = "2", default-features = false, features = ["tls"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
] }
